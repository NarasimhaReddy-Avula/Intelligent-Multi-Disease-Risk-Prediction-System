# =============================================================================
# UNIFIED SCHEMA FOR MULTI-DISEASE RISK PREDICTION PLATFORM
# =============================================================================
# Version: 1.0
# Created: Week 3 - Dataset Fusion Part 1
# Purpose: Define standardized features across Heart, Diabetes, Liver, Kidney datasets
#
# Design Principles:
# 1. Include clinical biomarkers only (lifestyle reserved for NLP - Week 8)
# 2. Features must be present in 2+ datasets OR critical for specific disease
# 3. Missing values filled with NaN (imputation in Week 4)
# 4. Targets are continuous risk scores (0.0-1.0), not binary labels
# =============================================================================

schema_version: "1.0"
total_features: 24
total_targets: 4

# =============================================================================
# FEATURE DEFINITIONS
# =============================================================================

features:
  # ---------------------------------------------------------------------------
  # DEMOGRAPHICS (3 features)
  # ---------------------------------------------------------------------------
  demographics:
    age:
      description: "Patient age in years"
      dtype: float32
      range: [18, 100]
      unit: "years"
      sources:
        heart: "age"  # NOTE: Convert from days to years (age / 365.25)
        diabetes: "age"
        liver: "Age of the patient"
        kidney: "Age"
      missing_strategy: "impute_median"
      
    gender:
      description: "Patient gender (0=Female, 1=Male)"
      dtype: int8
      range: [0, 1]
      unit: "binary"
      sources:
        heart: "gender"  # NOTE: 1=Female, 2=Male → remap to 0/1
        diabetes: "gender"  # NOTE: 'Female'/'Male' → encode to 0/1
        liver: "Gender of the patient"  # NOTE: 'Female'/'Male' → encode to 0/1
        kidney: "Gender"  # Already 0/1
      missing_strategy: "impute_mode"
      
    bmi:
      description: "Body Mass Index"
      dtype: float32
      range: [15, 60]
      unit: "kg/m²"
      sources:
        heart: null  # DERIVE: weight / (height/100)²
        diabetes: "bmi"
        liver: null  # Not available
        kidney: "BMI"
      missing_strategy: "impute_median"

  # ---------------------------------------------------------------------------
  # VITAL SIGNS (2 features)
  # ---------------------------------------------------------------------------
  vitals:
    systolic_bp:
      description: "Systolic blood pressure"
      dtype: float32
      range: [80, 220]
      unit: "mmHg"
      sources:
        heart: "ap_hi"
        diabetes: "systolic_bp"
        liver: null  # Not available
        kidney: "SystolicBP"
      missing_strategy: "impute_median"
      
    diastolic_bp:
      description: "Diastolic blood pressure"
      dtype: float32
      range: [40, 140]
      unit: "mmHg"
      sources:
        heart: "ap_lo"
        diabetes: "diastolic_bp"
        liver: null  # Not available
        kidney: "DiastolicBP"
      missing_strategy: "impute_median"

  # ---------------------------------------------------------------------------
  # LIPID PANEL (4 features)
  # ---------------------------------------------------------------------------
  lipid_panel:
    cholesterol_total:
      description: "Total cholesterol"
      dtype: float32
      range: [100, 400]
      unit: "mg/dL"
      sources:
        heart: "cholesterol"  # NOTE: Categorical 1/2/3 → expand to estimated mg/dL
        diabetes: "cholesterol_total"
        liver: null  # Not available
        kidney: "CholesterolTotal"
      missing_strategy: "impute_median"
      categorical_mapping:
        heart:
          1: 180  # Normal (<200)
          2: 239  # Above normal (200-239)
          3: 280  # Well above normal (>=240)
          
    hdl:
      description: "HDL cholesterol (good cholesterol)"
      dtype: float32
      range: [20, 100]
      unit: "mg/dL"
      sources:
        heart: null  # Not available
        diabetes: "hdl_cholesterol"
        liver: null  # Not available
        kidney: "CholesterolHDL"
      missing_strategy: "impute_median"
      
    ldl:
      description: "LDL cholesterol (bad cholesterol)"
      dtype: float32
      range: [40, 250]
      unit: "mg/dL"
      sources:
        heart: null  # Not available
        diabetes: "ldl_cholesterol"
        liver: null  # Not available
        kidney: "CholesterolLDL"
      missing_strategy: "impute_median"
      
    triglycerides:
      description: "Triglycerides level"
      dtype: float32
      range: [30, 500]
      unit: "mg/dL"
      sources:
        heart: null  # Not available
        diabetes: "triglycerides"
        liver: null  # Not available
        kidney: "CholesterolTriglycerides"
      missing_strategy: "impute_median"

  # ---------------------------------------------------------------------------
  # GLUCOSE METABOLISM (2 features)
  # ---------------------------------------------------------------------------
  glucose:
    glucose_fasting:
      description: "Fasting blood glucose"
      dtype: float32
      range: [50, 300]
      unit: "mg/dL"
      sources:
        heart: "gluc"  # NOTE: Categorical 1/2/3 → expand to estimated mg/dL
        diabetes: "glucose_fasting"
        liver: null  # Not available
        kidney: "FastingBloodSugar"
      missing_strategy: "impute_median"
      categorical_mapping:
        heart:
          1: 90   # Normal (<100)
          2: 115  # Above normal (100-125)
          3: 150  # Well above normal (>=126)
          
    hba1c:
      description: "Glycated hemoglobin (3-month average glucose)"
      dtype: float32
      range: [4.0, 14.0]
      unit: "%"
      sources:
        heart: null  # Not available
        diabetes: "hba1c"
        liver: null  # Not available
        kidney: "HbA1c"
      missing_strategy: "impute_median"

  # ---------------------------------------------------------------------------
  # KIDNEY FUNCTION (4 features) - Critical for CKD detection
  # ---------------------------------------------------------------------------
  kidney_markers:
    serum_creatinine:
      description: "Serum creatinine - kidney waste filtration marker"
      dtype: float32
      range: [0.5, 15.0]
      unit: "mg/dL"
      sources:
        heart: null
        diabetes: null
        liver: null
        kidney: "SerumCreatinine"
      missing_strategy: "impute_median"
      clinical_note: "Elevated levels indicate reduced kidney function"
      
    bun:
      description: "Blood Urea Nitrogen"
      dtype: float32
      range: [5, 100]
      unit: "mg/dL"
      sources:
        heart: null
        diabetes: null
        liver: null
        kidney: "BUNLevels"
      missing_strategy: "impute_median"
      clinical_note: "High BUN suggests kidney dysfunction or dehydration"
      
    gfr:
      description: "Glomerular Filtration Rate - kidney function measure"
      dtype: float32
      range: [5, 120]
      unit: "mL/min/1.73m²"
      sources:
        heart: null
        diabetes: null
        liver: null
        kidney: "GFR"
      missing_strategy: "impute_median"
      clinical_note: "GFR <60 for 3+ months indicates CKD"
      staging:
        - stage: "G1"
          range: [90, 120]
          description: "Normal or high"
        - stage: "G2"
          range: [60, 89]
          description: "Mildly decreased"
        - stage: "G3a"
          range: [45, 59]
          description: "Mildly to moderately decreased"
        - stage: "G3b"
          range: [30, 44]
          description: "Moderately to severely decreased"
        - stage: "G4"
          range: [15, 29]
          description: "Severely decreased"
        - stage: "G5"
          range: [0, 14]
          description: "Kidney failure"
          
    protein_urine:
      description: "Protein in urine (proteinuria)"
      dtype: float32
      range: [0, 5]
      unit: "g/day"
      sources:
        heart: null
        diabetes: null
        liver: null
        kidney: "ProteinInUrine"
      missing_strategy: "impute_median"
      clinical_note: "Proteinuria is early sign of kidney damage"

  # ---------------------------------------------------------------------------
  # LIVER FUNCTION (8 features) - Critical for liver disease detection
  # ---------------------------------------------------------------------------
  liver_markers:
    alt:
      description: "Alanine Aminotransferase (SGPT) - liver enzyme"
      dtype: float32
      range: [5, 500]
      unit: "U/L"
      sources:
        heart: null
        diabetes: null
        liver: "Sgpt Alamine Aminotransferase"
        kidney: null
      missing_strategy: "impute_median"
      clinical_note: "Elevated ALT indicates liver cell damage"
      
    ast:
      description: "Aspartate Aminotransferase (SGOT) - liver enzyme"
      dtype: float32
      range: [5, 500]
      unit: "U/L"
      sources:
        heart: null
        diabetes: null
        liver: "Sgot Aspartate Aminotransferase"
        kidney: null
      missing_strategy: "impute_median"
      clinical_note: "Elevated AST indicates liver or muscle damage"
      
    alp:
      description: "Alkaline Phosphatase - liver/bone enzyme"
      dtype: float32
      range: [30, 1000]
      unit: "U/L"
      sources:
        heart: null
        diabetes: null
        liver: "Alkphos Alkaline Phosphotase"
        kidney: null
      missing_strategy: "impute_median"
      clinical_note: "Elevated ALP suggests bile duct obstruction"
      
    bilirubin_total:
      description: "Total bilirubin - liver processing marker"
      dtype: float32
      range: [0.1, 30]
      unit: "mg/dL"
      sources:
        heart: null
        diabetes: null
        liver: "Total Bilirubin"
        kidney: null
      missing_strategy: "impute_median"
      clinical_note: "High bilirubin causes jaundice"
      
    bilirubin_direct:
      description: "Direct (conjugated) bilirubin"
      dtype: float32
      range: [0.0, 15]
      unit: "mg/dL"
      sources:
        heart: null
        diabetes: null
        liver: "Direct Bilirubin"
        kidney: null
      missing_strategy: "impute_median"
      
    albumin:
      description: "Serum albumin - liver synthetic function"
      dtype: float32
      range: [1.5, 6.0]
      unit: "g/dL"
      sources:
        heart: null
        diabetes: null
        liver: "ALB Albumin"
        kidney: null
      missing_strategy: "impute_median"
      clinical_note: "Low albumin indicates chronic liver disease"
      
    total_protein:
      description: "Total serum protein"
      dtype: float32
      range: [4.0, 10.0]
      unit: "g/dL"
      sources:
        heart: null
        diabetes: null
        liver: "Total Protiens"
        kidney: null
      missing_strategy: "impute_median"
      
    ag_ratio:
      description: "Albumin/Globulin ratio"
      dtype: float32
      range: [0.3, 2.5]
      unit: "ratio"
      sources:
        heart: null
        diabetes: null
        liver: "A/G Ratio Albumin and Globulin Ratio"
        kidney: null
      missing_strategy: "impute_median"
      clinical_note: "Low A/G ratio suggests liver or kidney disease"

  # ---------------------------------------------------------------------------
  # HEMATOLOGY (1 feature)
  # ---------------------------------------------------------------------------
  hematology:
    hemoglobin:
      description: "Hemoglobin level"
      dtype: float32
      range: [6, 20]
      unit: "g/dL"
      sources:
        heart: null
        diabetes: null
        liver: null
        kidney: "HemoglobinLevels"
      missing_strategy: "impute_median"
      clinical_note: "Low hemoglobin (anemia) common in CKD"

# =============================================================================
# TARGET DEFINITIONS (Risk Scores)
# =============================================================================

targets:
  heart_disease_risk:
    description: "Heart disease risk score"
    dtype: float32
    range: [0.0, 1.0]
    unit: "probability"
    source_label: "cardio"  # Binary 0/1 in heart dataset
    generation_method: "model_probability"  # Train model, use sigmoid output
    
  diabetes_risk:
    description: "Diabetes risk score"
    dtype: float32
    range: [0.0, 1.0]
    unit: "probability"
    source_label: "diabetes_risk_score"  # Already 0-100 scale, normalize to 0-1
    generation_method: "normalize_existing"  # Divide by 100
    
  kidney_disease_risk:
    description: "Chronic kidney disease risk score"
    dtype: float32
    range: [0.0, 1.0]
    unit: "probability"
    source_label: "Diagnosis"  # Binary 0/1 in kidney dataset
    generation_method: "model_probability"
    
  liver_disease_risk:
    description: "Liver disease risk score"
    dtype: float32
    range: [0.0, 1.0]
    unit: "probability"
    source_label: "Result"  # Binary 0/1 in liver dataset
    generation_method: "model_probability"

# =============================================================================
# EXCLUDED FEATURES (with rationale)
# =============================================================================

excluded_features:
  # LIFESTYLE - Reserved for NLP (Week 8)
  smoking:
    reason: "Reserved for NLP extraction from clinical notes"
    available_in: ["heart", "kidney", "diabetes"]
    week_8_extraction: true
    
  alcohol:
    reason: "Reserved for NLP extraction from clinical notes"
    available_in: ["heart", "kidney", "diabetes"]
    week_8_extraction: true
    
  physical_activity:
    reason: "Reserved for NLP extraction from clinical notes"
    available_in: ["heart", "kidney", "diabetes"]
    week_8_extraction: true
    
  family_history:
    reason: "Reserved for NLP extraction from clinical notes"
    available_in: ["kidney", "diabetes"]
    week_8_extraction: true

  # SINGLE DATASET - Insufficient for multi-disease model
  insulin_level:
    reason: "Available only in diabetes dataset (1/4)"
    available_in: ["diabetes"]
    technical_rationale: |
      Including insulin would create 75% missing values across unified dataset.
      FT-Transformer performance degrades significantly with >50% missing in a feature.
      Imputation for 75% missing would introduce more noise than signal.
    medical_rationale: |
      Insulin levels are highly variable and depend on:
      - Timing of measurement (fasting vs postprandial)
      - Medication status (exogenous insulin therapy)
      - Individual metabolic variation
      For diabetes risk, HbA1c and fasting glucose are more reliable and standardized.
      HbA1c reflects 3-month glucose average, making it superior for risk prediction.
    
  heart_rate:
    reason: "Available only in diabetes dataset (1/4)"
    available_in: ["diabetes"]
    
  waist_to_hip_ratio:
    reason: "Available only in diabetes dataset (1/4)"
    available_in: ["diabetes"]
    
  # TREATMENT/MEDICATION - Not predictors, they're interventions
  medications:
    reason: "Treatment variables, not risk predictors"
    available_in: ["kidney"]
    examples: ["ACEInhibitors", "Diuretics", "Statins", "AntidiabeticMedications"]
    
  # SYMPTOMS - Reserved for NLP
  symptoms:
    reason: "Reserved for NLP extraction from clinical notes"
    available_in: ["kidney"]
    examples: ["Edema", "FatigueLevels", "NauseaVomiting", "MuscleCramps", "Itching"]

# =============================================================================
# DATASET SOURCE MAPPING SUMMARY
# =============================================================================

dataset_coverage:
  heart:
    total_unified_features: 8  # age, gender, bmi(derived), bp(2), cholesterol, glucose
    missing_features: 16
    coverage_percent: 33.3
    
  diabetes:
    total_unified_features: 12  # demographics(3), vitals(2), lipid(4), glucose(2), hba1c
    missing_features: 12
    coverage_percent: 50.0
    
  liver:
    total_unified_features: 10  # age, gender, all liver markers(8)
    missing_features: 14
    coverage_percent: 41.7
    
  kidney:
    total_unified_features: 15  # demographics(3), vitals(2), lipid(4), glucose(2), kidney(4)
    missing_features: 9
    coverage_percent: 62.5
